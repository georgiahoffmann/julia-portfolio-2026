settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "cms: cria {path} ({userName})"
      update: "cms: atualiza {path} ({userName})"
      delete: "cms: apaga {path} ({userName})"
      rename: "cms: renomeia {oldPath} → {newPath} ({userName})"

media:
  - name: posts
    label: Posts de redes sociais
    input: src/assets/posts
    output: ../../../assets/posts
    extensions: [jpg, jpeg, png, gif, webp]
    rename: safe
  - name: sobre
    label: Sobre (fotos e coisas)
    input: src/assets/sobre
    output: ../../assets/sobre
    extensions: [jpg, jpeg, png, gif, webp]
    rename: safe
  - name: site
    label: Imagem de compartilhamento
    input: src/assets/site
    output: ../../assets/site
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: projetos
    label: Capas dos projetos
    input: src/assets/projetos
    output: ../../assets/projetos
    extensions: [gif, jpg, jpeg, png, webp]
    rename: false

content:
  - name: posts
    label: Posts de redes sociais
    type: group
    items:
      - name: carrosseis
        label: Carrosséis
        type: collection
        path: src/content/posts/carrosseis
        format: yaml-frontmatter
        operations:
          create: false
          delete: false
          rename: false
        view:
          primary: title
          fields: [title, tipo]
          search: [title]
        fields:
          - name: title
            label: Título
            type: string
            required: true
          - name: tipo
            label: Status
            type: select
            required: true
            options:
              values:
                - name: imagem
                  label: Publicado
                - name: pendente
                  label: Pendente (sem imagem ainda)
          - name: image
            label: Capa (1ª lâmina)
            type: image
            options:
              media: posts
          - name: slides
            label: Demais lâminas
            description: Passam em loop no card, na ordem desta lista.
            type: image
            options:
              media: posts
              multiple: true
          - name: alt
            label: Descrição da capa (acessibilidade)
            type: string
          - name: link
            label: Link (post no Instagram)
            type: string
            pattern:
              regex: "^https?://"
              message: "Comece com https://"
          - name: funcao
            label: Papel dela neste trabalho
            description: Aparece ao passar o mouse na esfera.
            type: string

      - name: avulsos
        label: Posts avulsos
        type: collection
        path: src/content/posts/avulsos
        format: yaml-frontmatter
        operations:
          create: false
          delete: false
          rename: false
        view:
          primary: title
          fields: [title, tipo]
          search: [title]
        fields:
          - name: title
            label: Título
            type: string
            required: true
          - name: tipo
            label: Status
            type: select
            required: true
            description: Ao colocar uma imagem num post pendente, troque para "Publicado".
            options:
              values:
                - name: imagem
                  label: Publicado
                - name: pendente
                  label: Pendente (sem imagem ainda)
                - name: pendente-video
                  label: Pendente (vídeo)
          - name: image
            label: Imagem
            type: image
            options:
              media: posts
          - name: alt
            label: Descrição da imagem (acessibilidade)
            type: string
          - name: link
            label: Link (post no Instagram)
            type: string
            pattern:
              regex: "^https?://"
              message: "Comece com https://"
          - name: funcao
            label: Papel dela neste trabalho
            description: Aparece ao passar o mouse na esfera.
            type: string

  - name: projetos
    label: Projetos
    type: collection
    path: src/content/projetos
    format: yaml-frontmatter
    operations:
      create: false
      delete: false
      rename: false
    view:
      primary: titulo
      fields: [titulo, subtitulo]
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: subtitulo
        label: Subtítulo
        type: string
        required: true
      - name: chamada
        label: Chamada do link
        type: string
        required: true
      - name: link
        label: Link do projeto completo (Behance etc.)
        type: string
        pattern:
          regex: "^https?://"
          message: "Comece com https://"
      - name: selo
        label: Selo (opcional, ex. prêmio)
        type: string
      - name: body
        label: Descrição
        type: rich-text
        options:
          format: markdown
          media: false

  - name: sobre
    label: Sobre e site
    type: file
    path: src/content/sobre/julia.md
    format: yaml-frontmatter
    operations:
      delete: false
    fields:
      - name: fotos
        label: Fotos da seção "sobre, a do grid"
        type: object
        fields:
          - name: grande
            label: Foto grande (esquerda)
            type: image
            required: true
            options:
              media: sobre
          - name: grandeAlt
            label: Descrição da foto grande
            type: string
          - name: topo
            label: Foto do canto superior direito
            type: image
            required: true
            options:
              media: sobre
          - name: topoAlt
            label: Descrição da foto do canto direito
            type: string
          - name: centro
            label: Foto do meio
            type: image
            required: true
            options:
              media: sobre
          - name: centroAlt
            label: Descrição da foto do meio
            type: string

      - name: coisas
        label: Coisas que saem da cabeça da juju (ao passar o mouse no GIF)
        description: PNG com fundo transparente. O tamanho e a posição de cada uma são fixos.
        type: object
        fields:
          - name: esquerdaAlto
            label: Esquerda, em cima (aparece também no celular)
            type: image
            required: true
            options:
              media: sobre
          - name: esquerdaLonge
            label: Esquerda, mais afastada (só computador)
            type: image
            required: true
            options:
              media: sobre
          - name: esquerdaBaixo
            label: Esquerda, embaixo (só computador)
            type: image
            required: true
            options:
              media: sobre
          - name: direitaAlto
            label: Direita, em cima (só computador)
            type: image
            required: true
            options:
              media: sobre
          - name: direitaLonge
            label: Direita, mais afastada (aparece também no celular)
            type: image
            required: true
            options:
              media: sobre
          - name: direitaBaixo
            label: Direita, embaixo (só computador; também é o adesivo da seção de fotos)
            type: image
            required: true
            options:
              media: sobre

      - name: site
        label: Compartilhamento do site
        description: O que aparece na aba do navegador e quando alguém envia o link (WhatsApp, Instagram, LinkedIn...).
        type: object
        fields:
          - name: titulo
            label: Título do site
            type: string
            required: true
            options:
              maxlength: 70
          - name: descricao
            label: Descrição
            type: text
            required: true
            options:
              maxlength: 160
          - name: imagem
            label: Imagem de capa ao compartilhar
            description: Ideal 1200×630 (horizontal). Outros tamanhos são recortados pelo centro.
            type: image
            required: true
            options:
              media: site
          - name: imagemAlt
            label: Descrição da imagem de capa
            type: string

      - name: email
        label: E-mail (copiado ao clicar em "Email")
        type: string
        required: true
      - name: instagram
        label: Instagram (só o usuário, sem @)
        type: string
        required: true
      - name: linkedin
        label: linkedin (só o usuário, sem @)
        type: string
        required: true