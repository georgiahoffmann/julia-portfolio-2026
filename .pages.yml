settings:
  content:
    merge: true 
  commit:
    identity: app
    templates:
      create: "cms: cria {path} ({userName})"
      update: "cms: atualiza {path} ({userName})"
      delete: "cms: apaga {path} ({userName})"
      rename: "cms: renomeia {oldPath} → {newPath} ({userName})"

media:
  - name: sobre
    label: Fotos do sobre e compartilhamento
    input: src/assets/sobre
    output: ../../assets/sobre
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: posts
    label: Imagens dos posts
    input: src/assets/posts
    output: ../../assets/posts
    extensions: [jpg, jpeg, png, gif, webp]
    rename: safe
  - name: slides
    label: Lâminas dos carrosséis
    input: src/assets/posts-slides
    output: ../../assets/posts-slides
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: projetos
    label: Capas dos projetos
    input: src/assets/projetos
    output: ../../assets/projetos
    extensions: [gif, jpg, jpeg, png, webp]
    rename: false 

content:
  - name: sobre
    label: Sobre e site
    type: file
    path: src/content/sobre/julia.md
    format: yaml-frontmatter
    operations:
      delete: false
    fields:
      - name: site
        label: Compartilhamento do site
        description: O que aparece na aba do navegador e quando alguém envia o link (WhatsApp, Instagram, LinkedIn...).
        type: object
        fields:
          - name: titulo
            label: Título do site
            type: string
            required: true
            options:
              maxlength: 70
          - name: descricao
            label: Descrição
            type: text
            required: true
            options:
              maxlength: 160
          - name: imagem
            label: Imagem de capa ao compartilhar
            description: Ideal 1200×630 (horizontal). Outros tamanhos são recortados pelo centro.
            type: image
            required: true
            options:
              media: sobre
          - name: imagemAlt
            label: Descrição da imagem de capa
            type: string

      - name: fotos
        label: Fotos da seção "sobre mim"
        type: object
        fields:
          - name: grande
            label: Foto grande (esquerda)
            type: image
            required: true
            options:
              media: sobre
          - name: grandeAlt
            label: Descrição da foto grande
            type: string
          - name: topo
            label: Foto do canto superior direito
            type: image
            required: true
            options:
              media: sobre
          - name: topoAlt
            label: Descrição da foto do canto
            type: string
          - name: centro
            label: Foto do meio
            type: image
            required: true
            options:
              media: sobre
          - name: centroAlt
            label: Descrição da foto do meio
            type: string

      - name: email
        label: E-mail (copiado ao clicar em "Email")
        type: string
        required: true
      - name: instagram
        label: Instagram (só o usuário, sem @)
        type: string
        required: true

  - name: projetos
    label: Projetos
    type: collection
    path: src/content/projetos
    format: yaml-frontmatter
    operations:
      create: false
      delete: false
      rename: false
    view:
      primary: titulo
      fields: [titulo, subtitulo]
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: subtitulo
        label: Subtítulo
        type: string
        required: true
      - name: chamada
        label: Chamada do link
        type: string
        required: true
      - name: link
        label: Link do projeto completo (Behance etc.)
        type: string
        pattern:
          regex: "^https?://"
          message: "Comece com https://"
      - name: selo
        label: Selo (opcional, ex. prêmio)
        type: string
      - name: body
        label: Descrição
        type: rich-text
        options:
          format: markdown
          media: false

  - name: posts
    label: Posts da galeria
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    operations:
      create: false
      delete: false
      rename: false
    view:
      primary: title
      fields: [title, tipo]
      search: [title]
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: tipo
        label: Tipo
        type: select
        required: true
        description: Ao colocar uma imagem num post pendente, troque para "Imagem".
        options:
          values:
            - name: imagem
              label: Imagem
            - name: pendente
              label: Pendente (sem imagem ainda)
            - name: pendente-video
              label: Pendente (vídeo)
      - name: image
        label: Imagem / capa
        type: image
        options:
          media: posts
      - name: alt
        label: Descrição da imagem (acessibilidade)
        type: string
      - name: slides
        label: Demais lâminas do carrossel
        description: A capa é a imagem acima. Estas passam em loop no card.
        type: image
        options:
          media: slides
          multiple: true
      - name: link
        label: Link (post no Instagram)
        type: string
        pattern:
          regex: "^https?://"
          message: "Comece com https://"
      - name: funcao
        label: Papel dela neste trabalho
        description: Aparece ao passar o mouse na esfera.
        type: string